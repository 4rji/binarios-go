heat_template_version: 2018-08-31

description: Single VM smoke-test lab template.

parameters:
  image:
    type: string
    description: Glance image name or ID.
  flavor:
    type: string
    description: Nova flavor name or ID.
  network:
    type: string
    description: Existing Neutron network name or ID.

resources:
  smoke_security_group:
    type: OS::Neutron::SecurityGroup
    properties:
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
          remote_ip_prefix: 0.0.0.0/0
        - protocol: icmp
          remote_ip_prefix: 0.0.0.0/0

  server_port:
    type: OS::Neutron::Port
    properties:
      network: { get_param: network }
      security_groups:
        - { get_resource: smoke_security_group }

  server:
    type: OS::Nova::Server
    properties:
      name: lab-smoke-test
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - port: { get_resource: server_port }

outputs:
  server_id:
    value: { get_resource: server }
  vm_name:
    value: { get_attr: [server, name] }
  fixed_ip:
    value: { get_attr: [server, first_address] }
  addresses:
    value: { get_attr: [server, addresses] }
  novnc_console_url:
    value: { get_attr: [server, console_urls, novnc] }
  ssh_user:
    value: debian
  ssh_password:
    value: image default or configured key
